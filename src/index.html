<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firefly Zero app uploader</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="text-center">
      Upload an app to a <a href="https://fireflyzero.com/">Firefly Zero</a> device
    </h1>
    <div class="row">
      <form id="form" class="col-md-6 offset-md-3" onsubmit="return postFile(event);">
        <div
          id="alert"
          class="alert alert-danger"
          style="display: none"
          role="alert"
        ></div>
        <div
          id="success"
          class="alert alert-success"
          style="display: none"
          role="alert"
        ></div>

        <div class="mb-3 row">
          <label for="id" class="col-form-label col-sm-2">Session ID:</label>
          <div class="col-sm-10">
            <input id="id" type="number" name="id" class="form-control" required />
          </div>
        </div>

        <div class="mb-3 row">
          <label for="file" class="col-form-label col-sm-2">Zip file:</label>
          <div class="col-sm-10">
            <input id="file" type="file" name="file" class="form-control" required />
          </div>
        </div>

        <button id="button" class="btn btn-primary" style="width: 100%">Upload</button>

        <progress
          id="progress"
          value="0"
          max="100"
          class="progress"
          role="progressbar"
          style="display: none"
        ></progress>
      </form>
    </div>
    <script>
      function showBox(id) {
        document.getElementById(id).style.display = "block";
      }

      function hideBox(id) {
        document.getElementById(id).style.display = "none";
      }

      function postFile(e) {
        e.preventDefault();
        const file = document.getElementById("file").files[0];
        var xhr = new XMLHttpRequest();
        xhr.responseType = "text";

        // Update progress bar.
        xhr.upload.addEventListener("progress", function (e) {
          var fileSize = document.getElementById("file").files[0].size;
          let progress = Math.round((e.loaded / fileSize) * 100);
          if (progress > 99) {
            progress = 99;
          }
          document.getElementById("progress").setAttribute("value", progress);
        });

        // Handle response.
        xhr.onload = (e) => {
          if (xhr.readyState !== 4) {
            return;
          }
          hideBox("progress");
          showBox("button");
          if (xhr.status === 200) {
            showBox("success");
            document.getElementById("success").innerText = "app is uploaded";
          } else {
            showBox("alert");
            const msg = xhr.response || "unknown error";
            document.getElementById("alert").innerText = msg;
          }
        };

        const id = document.getElementById("id").value;
        const url = `/upload/${id}`;
        hideBox("alert");
        hideBox("success");
        hideBox("button");
        showBox("progress");
        xhr.open("post", url);
        xhr.send(file);
        return false;
      }
    </script>
  </body>
</html>
