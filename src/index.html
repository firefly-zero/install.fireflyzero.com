<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firefly Zero app uploader</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <h1 class="text-center">
      Upload an app to a <a href="https://fireflyzero.com/">Firefly Zero</a> device
    </h1>
    <div class="row">
      <form
        id="form"
        hx-encoding="multipart/form-data"
        hx-post="/upload"
        class="col-md-6 offset-md-3"
      >
        <div
          id="alert"
          class="alert alert-danger"
          style="display: none"
          role="alert"
        ></div>
        <div class="mb-3 row">
          <label for="id" class="col-form-label col-sm-2">Session ID:</label>
          <div class="col-sm-10">
            <input type="number" name="id" class="form-control" required />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="file" class="col-form-label col-sm-2">Zip file:</label>
          <div class="col-sm-10">
            <input type="file" name="file" class="form-control" required />
          </div>
        </div>
        <button class="btn btn-primary" style="width: 100%" type="submit">Upload</button>
        <progress
          id="progress"
          value="0"
          max="100"
          class="progress"
          role="progressbar"
          style="display: none"
        ></progress>
      </form>
    </div>
    <script>
      htmx.on("#form", "htmx:afterRequest", function (evt) {
        htmx.find("button").setAttribute("style", "display: block; width: 100%");
        htmx.find("progress").setAttribute("style", "display: none");
      });
      htmx.on("#form", "htmx:responseError", function (evt) {
        const alertElement = htmx.find("#alert");
        alertElement.setAttribute("style", "display: block");
        alertElement.innerText = evt.detail.xhr.response;
      });
      htmx.on("#form", "htmx:sendError", function (evt) {
        const alertElement = htmx.find("#alert");
        alertElement.setAttribute("style", "display: block");
        alertElement.innerText = "network error";
      });
      htmx.on("#form", "htmx:beforeSend", function (evt) {
        htmx.find("button").setAttribute("style", "display: none");
        htmx
          .find("progress")
          .setAttribute("style", "display: block; width: 100%; height: 38px");
      });
      htmx.on("#form", "htmx:xhr:progress", function (evt) {
        htmx
          .find("#progress")
          .setAttribute("value", (evt.detail.loaded / evt.detail.total) * 100);
      });
    </script>
  </body>
</html>
